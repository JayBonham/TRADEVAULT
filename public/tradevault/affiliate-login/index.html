<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affiliate Login — The Trade Vault</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/tv-icon.png">
<link rel="stylesheet" href="../aff.css">
<style>
main{display:grid;place-items:center;padding-block:40px}
.box{width:100%;max-width:430px}
.brandc{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
.brandc img:first-child{width:30px;height:30px}.brandc img+img{height:15px;width:auto}
.card{padding:30px 28px 28px}
form{display:grid;gap:14px;margin-top:22px}
.below{text-align:center;margin-top:18px;font-size:14px;color:var(--tx-mute)}
.below a{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main class="W">
  <div class="box view">
    <a href="/" class="brandc"><img src="../assets/tv-icon.png" alt="" width="30" height="30"><img src="../assets/tv-logo.png" alt="The Trade Vault" width="190" height="15"></a>
    <div class="card">
      <span class="eyebrow">Affiliates</span>
      <h1 style="font-size:34px">Affiliate login</h1>
      <p class="muted" style="font-size:14.5px;margin-top:8px">See your clicks, members and commission.</p>
      <form id="f" novalidate>
        <div class="field"><label for="email">Email</label><div class="inp"><input id="email" type="email" autocomplete="email" required></div></div>
        <div class="field"><label for="pw">Password</label><div class="inp"><input id="pw" type="password" autocomplete="current-password" required></div></div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" id="go" type="submit">Log in</button>
      </form>
    </div>
    <p class="below">Not an affiliate yet? <a href="/affiliate-signup">Join the programme</a><br>Forgot your password? Email support@thetradevault.co</p>
  </div>
</main>
<script>
(function () {
  var API = 'https://jaybonham.com/api/tv-aff';
  try { if (localStorage.getItem('tv_aff_token')) location.replace('/affiliate-portal'); } catch (e) {}
  var f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim(), pw = document.getElementById('pw').value;
    if (!email || !pw) { err.textContent = 'Enter your email and password.'; return; }
    err.textContent = '';
    go.disabled = true; go.innerHTML = '<span class="spin"></span>Logging in';
    fetch(API + '?action=login', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ email: email, password: pw }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw { msg: d.error };
        try { localStorage.setItem('tv_aff_token', d.token); } catch (x) {}
        location.replace('/affiliate-portal');
      })
      .catch(function (x) {
        err.textContent = (x && x.msg) || 'Something went wrong. Please try again.';
        go.disabled = false; go.textContent = 'Log in';
      });
  });
})();
</script>
</body>
</html>
