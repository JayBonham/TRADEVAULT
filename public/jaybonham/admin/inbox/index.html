<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox — JB Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;height:100vh;background:#06080B;color:#F2F5F7;font-family:'Archivo',sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.layout{display:flex;height:100vh}
.sidebar{width:220px;flex:none;background:#0A0E14;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.sb-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-logo-text{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.sb-logo-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#4B9EFF;margin-top:1px}
.sb-nav{padding:16px 0;flex:1}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:#9AA4B0;transition:color .15s,background .15s;border-left:2px solid transparent}
.sb-link:hover{color:#F2F5F7;background:rgba(255,255,255,.03)}
.sb-link.active{color:#4B9EFF;border-left-color:#4B9EFF;background:rgba(75,158,255,.06)}
.sb-link .badge-count{margin-left:auto;background:rgba(255,100,100,.2);color:#FF6B6B;font-family:'IBM Plex Mono',monospace;font-size:9px;padding:1px 6px;letter-spacing:.06em}
.sb-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#5C6672;display:flex;align-items:center;justify-content:space-between}
.sb-user button{font-size:11px;color:#FF6B6B;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}

/* inbox layout */
.inbox-wrap{flex:1;display:flex;overflow:hidden}

/* conversation list */
.conv-list{width:340px;flex:none;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;overflow:hidden}
.conv-list-head{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.conv-list-head h2{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin:0}
.filter-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.ftab{flex:1;padding:9px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#4A5566;border-bottom:2px solid transparent;transition:all .15s;text-align:center}
.ftab:hover{color:#C8D0D8}
.ftab.active{color:#4B9EFF;border-bottom-color:#4B9EFF}
.conv-scroll{flex:1;overflow-y:auto}
.conv-item{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .12s;position:relative}
.conv-item:hover{background:rgba(255,255,255,.025)}
.conv-item.active{background:rgba(75,158,255,.07);border-left:2px solid #4B9EFF}
.conv-item.unread .conv-name{color:#F2F5F7;font-weight:600}
.conv-name{font-size:14px;color:#C8D0D8;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.conv-preview{font-size:12px;color:#4A5566;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.conv-foot{display:flex;align-items:center;justify-content:space-between}
.conv-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#3C4650}
.conv-status-dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot-open{background:#4BFF9E}
.dot-closed{background:#3C4650}
.unread-dot{width:7px;height:7px;border-radius:50%;background:#4B9EFF;flex:none}

/* thread panel */
.thread-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.thread-head{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.thread-head-name{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.thread-head-meta{display:flex;align-items:center;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4A5566}
.thread-head-meta a{color:#4B9EFF}
.thread-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}

/* message bubbles */
.msg{display:flex;gap:12px;align-items:flex-start}
.msg.msg-agent{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;flex:none}
.av-visitor{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#9AA4B0}
.av-agent{background:rgba(75,158,255,.15);border:1px solid rgba(75,158,255,.25);color:#4B9EFF}
.msg-bubble{max-width:70%;padding:12px 16px;line-height:1.55;font-size:14px}
.msg-visitor .msg-bubble{background:#0D1117;border:1px solid rgba(255,255,255,.07);color:#E0E6ED}
.msg-agent .msg-bubble{background:rgba(75,158,255,.1);border:1px solid rgba(75,158,255,.2);color:#D8ECFF}
.msg-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#3C4650;margin-top:5px}
.msg-agent .msg-time{text-align:right}

/* reply box */
.reply-area{padding:16px 24px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;background:#06080B}
.reply-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4A5566;margin-bottom:10px;letter-spacing:.1em;text-transform:uppercase}
.reply-row{display:flex;gap:10px;align-items:flex-end}
textarea#reply-input{flex:1;background:#0D1117;border:1px solid rgba(255,255,255,.1);color:#F2F5F7;font-size:14px;padding:11px 14px;outline:none;resize:none;min-height:60px;max-height:120px;font-family:'Archivo',sans-serif;line-height:1.5;transition:border-color .2s}
textarea#reply-input:focus{border-color:#4B9EFF}
.reply-send{padding:11px 22px;background:#4B9EFF;color:#030D1F;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s;white-space:nowrap;flex:none;align-self:flex-end}
.reply-send:hover{opacity:.85}
.reply-send:disabled{opacity:.35;cursor:not-allowed}

/* empty state */
.empty-thread{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#4A5566}
.empty-thread svg{opacity:.2}
.empty-thread p{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.list-empty{text-align:center;padding:40px 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#3C4650;letter-spacing:.1em;text-transform:uppercase}
.list-loading{text-align:center;padding:40px 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4A5566}
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-logo">
      <svg width="28" height="28" viewBox="0 0 56 56" fill="none">
        <text x="28" y="31" text-anchor="middle" font-family="'Saira Condensed',sans-serif" font-weight="800" font-size="32" letter-spacing="-1.5"><tspan fill="#F2F5F7">J</tspan><tspan fill="#4B9EFF">B</tspan></text>
        <polyline points="11,45 21,41 29,44 45,32" fill="none" stroke="#4B9EFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="sb-logo-text">Jay Bonham</div>
        <div class="sb-logo-sub">Sales Portal</div>
      </div>
    </div>
    <nav class="sb-nav">
      <a href="/leads" class="sb-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Leads
      </a>
      <a href="/inbox" class="sb-link active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Inbox
        <span class="badge-count" id="unread-count" style="display:none"></span>
      </a>
    </nav>
    <div class="sb-user">
      <span id="sb-username" style="font-family:'IBM Plex Mono',monospace;font-size:11px">—</span>
      <button onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- Inbox -->
  <div class="inbox-wrap">

    <!-- Conversation list -->
    <div class="conv-list">
      <div class="conv-list-head">
        <h2>Inbox</h2>
        <button onclick="loadConvs()" title="Refresh" style="color:#4A5566;padding:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polyline points="23 4 23 10 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="filter-tabs">
        <button class="ftab active" data-status="all" onclick="setFilter(this)">All</button>
        <button class="ftab" data-status="open" onclick="setFilter(this)">Open</button>
        <button class="ftab" data-status="closed" onclick="setFilter(this)">Closed</button>
      </div>
      <div class="conv-scroll" id="conv-scroll">
        <div class="list-loading">Loading…</div>
      </div>
    </div>

    <!-- Thread panel -->
    <div class="thread-panel" id="thread-panel">
      <div class="empty-thread">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>Select a conversation</p>
      </div>
    </div>

  </div>
</div>

<script>
var token = localStorage.getItem('jb_token');
var user  = localStorage.getItem('jb_user') || '';
if(!token) window.location.replace('/');
document.getElementById('sb-username').textContent = user;

var conversations = [];
var activeConvId  = null;
var filterStatus  = 'all';

function logout(){
  localStorage.removeItem('jb_token');
  localStorage.removeItem('jb_user');
  window.location.replace('/');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}

function fmtRelative(iso){
  if(!iso) return '';
  var d = new Date(iso), now = new Date();
  var diff = (now - d) / 1000;
  if(diff < 60)    return 'just now';
  if(diff < 3600)  return Math.floor(diff/60)+'m ago';
  if(diff < 86400) return Math.floor(diff/3600)+'h ago';
  if(diff < 604800)return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function fmtTime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}

function setFilter(btn){
  document.querySelectorAll('.ftab').forEach(function(t){t.classList.remove('active')});
  btn.classList.add('active');
  filterStatus = btn.dataset.status;
  loadConvs();
}

function loadConvs(){
  document.getElementById('conv-scroll').innerHTML = '<div class="list-loading">Loading…</div>';
  fetch('/api/admin-inbox?status='+filterStatus, {headers:{'Authorization':'Bearer '+token}})
  .then(function(r){if(r.status===401){logout();return null;}return r.json();})
  .then(function(data){
    if(!data||!data.ok){
      document.getElementById('conv-scroll').innerHTML='<div class="list-empty">Failed to load</div>';
      return;
    }
    conversations = data.conversations||[];
    renderConvList();
    // Count open/unread
    var opens = conversations.filter(function(c){return c.status==='open'}).length;
    var uc = document.getElementById('unread-count');
    if(opens > 0){uc.style.display='';uc.textContent=opens;}
    else{uc.style.display='none';}
  })
  .catch(function(){
    document.getElementById('conv-scroll').innerHTML='<div class="list-empty">Network error</div>';
  });
}

function renderConvList(){
  if(!conversations.length){
    document.getElementById('conv-scroll').innerHTML='<div class="list-empty">No conversations</div>';
    return;
  }
  var html = conversations.map(function(c){
    var visitor  = c.visitor || c.visitors?.[0] || {};
    var name     = visitor.name || visitor.email || 'Unknown';
    var lastMsg  = c.lastMessage || c.last_message || {};
    var preview  = lastMsg.text || lastMsg.content || '—';
    var when     = fmtRelative(c.updatedAt || c.updated_at || c.createdAt);
    var isOpen   = c.status === 'open';
    var isActive = c.id === activeConvId;
    var unread   = (c.unreadCount||c.unread_count||0) > 0;
    return '<div class="conv-item'+(isActive?' active':'')+(unread?' unread':'')+'" onclick="openConv(\''+esc(c.id)+'\')">'
      +'<div class="conv-name">'
        +'<span class="conv-status-dot '+(isOpen?'dot-open':'dot-closed')+'"></span>'
        +esc(trunc(name,28))
        +(unread?'<span class="unread-dot" style="margin-left:auto"></span>':'')
      +'</div>'
      +'<div class="conv-preview">'+esc(trunc(preview,50))+'</div>'
      +'<div class="conv-foot"><span class="conv-time">'+esc(when)+'</span></div>'
      +'</div>';
  }).join('');
  document.getElementById('conv-scroll').innerHTML = html;
}

function openConv(id){
  activeConvId = id;
  renderConvList(); // re-render to show active state

  // Show loading state in thread panel
  document.getElementById('thread-panel').innerHTML =
    '<div class="empty-thread"><p>Loading…</p></div>';

  fetch('/api/admin-inbox?id='+encodeURIComponent(id), {headers:{'Authorization':'Bearer '+token}})
  .then(function(r){if(r.status===401){logout();return null;}return r.json();})
  .then(function(data){
    if(!data||!data.ok){
      document.getElementById('thread-panel').innerHTML=
        '<div class="empty-thread"><p>Failed to load thread</p></div>';
      return;
    }
    renderThread(data.conversation);
  })
  .catch(function(){
    document.getElementById('thread-panel').innerHTML=
      '<div class="empty-thread"><p>Network error</p></div>';
  });
}

function renderThread(conv){
  var visitor  = conv.visitor || (conv.visitors&&conv.visitors[0]) || {};
  var vName    = visitor.name || visitor.email || 'Visitor';
  var vEmail   = visitor.email || '';
  var messages = conv.messages || [];

  var msgsHtml = messages.length ? messages.map(function(m){
    var isAgent   = m.type==='agent' || m.authorType==='agent' || m.fromAgent;
    var msgClass  = isAgent ? 'msg msg-agent' : 'msg msg-visitor';
    var avClass   = isAgent ? 'av-agent' : 'av-visitor';
    var avLetter  = isAgent ? (user[0]||'A').toUpperCase() : (vName[0]||'V').toUpperCase();
    var text      = m.text || m.content || m.body || '';
    var when      = fmtTime(m.createdAt || m.created_at);
    return '<div class="'+msgClass+'">'
      +'<div class="msg-avatar '+avClass+'">'+esc(avLetter)+'</div>'
      +'<div>'
        +'<div class="msg-bubble">'+esc(text).replace(/\n/g,'<br>')+'</div>'
        +'<div class="msg-time">'+esc(when)+'</div>'
      +'</div>'
      +'</div>';
  }).join('') : '<div style="text-align:center;padding:30px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:#3C4650">No messages yet</div>';

  var viewLeadLink = vEmail
    ? ' · <a href="/lead?email='+encodeURIComponent(vEmail)+'" style="color:#4B9EFF">View Lead →</a>'
    : '';

  document.getElementById('thread-panel').innerHTML =
    '<div class="thread-head">'
      +'<div class="thread-head-name">'+esc(vName)+'</div>'
      +'<div class="thread-head-meta">'
        +(vEmail?'<span>'+esc(vEmail)+'</span>':'')
        +'<span class="conv-status-dot '+(conv.status==='open'?'dot-open':'dot-closed')+'" style="display:inline-block"></span>'
        +'<span>'+esc(conv.status||'')+'</span>'
        +viewLeadLink
      +'</div>'
    +'</div>'
    +'<div class="thread-messages" id="thread-messages">'+msgsHtml+'</div>'
    +'<div class="reply-area">'
      +'<div class="reply-note">Reply via email (sends from info@jaybonham.com)</div>'
      +'<div class="reply-row">'
        +'<textarea id="reply-input" placeholder="Type your reply…" onkeydown="replyKeydown(event)"></textarea>'
        +'<button class="reply-send" id="reply-btn" onclick="sendReply(\''+esc(id)+'\',\''+esc(vEmail)+'\',\''+esc(vName)+'\')">Send →</button>'
      +'</div>'
      +'<div id="reply-msg" style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;margin-top:8px;display:none"></div>'
    +'</div>';

  // Scroll to bottom
  setTimeout(function(){
    var el = document.getElementById('thread-messages');
    if(el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function replyKeydown(e){
  // Cmd/Ctrl+Enter to send
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
    var id      = activeConvId;
    var conv    = conversations.find(function(c){return c.id===id;})||{};
    var visitor = conv.visitor || (conv.visitors&&conv.visitors[0]) || {};
    sendReply(id, visitor.email||'', visitor.name||'');
  }
}

function sendReply(convId, vEmail, vName){
  var msg  = (document.getElementById('reply-input').value||'').trim();
  if(!msg) return;
  if(!vEmail){
    var m = document.getElementById('reply-msg');
    m.style.display=''; m.style.color='#FF6B6B'; m.textContent='No email address for this contact.';
    return;
  }
  var btn  = document.getElementById('reply-btn');
  var msgEl= document.getElementById('reply-msg');
  btn.disabled=true; btn.textContent='Sending…';
  msgEl.style.display='none';

  // Send via admin-send (transactional email from info@jaybonham.com)
  fetch('/api/admin-send',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({type:'email',to_email:vEmail,to_name:vName,subject:'Re: Your inquiry',message:msg})
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false; btn.textContent='Send →';
    if(d.ok){
      document.getElementById('reply-input').value='';
      msgEl.style.display=''; msgEl.style.color='#4BFF9E'; msgEl.textContent='Sent ✓';
      setTimeout(function(){msgEl.style.display='none';},2500);
    } else {
      msgEl.style.display=''; msgEl.style.color='#FF6B6B'; msgEl.textContent=d.error||'Failed to send';
    }
  }).catch(function(){
    btn.disabled=false; btn.textContent='Send →';
    msgEl.style.display=''; msgEl.style.color='#FF6B6B'; msgEl.textContent='Network error';
  });
}

loadConvs();
// Auto-refresh every 60s
setInterval(loadConvs, 60000);
</script>
</body>
</html>
