<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead — JB Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;min-height:100vh;background:#06080B;color:#F2F5F7;font-family:'Archivo',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea,input,select{font-family:'Archivo',sans-serif}

.layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex:none;background:#0A0E14;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.main{flex:1;padding:32px;max-width:1100px}
.sb-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-logo-text{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.sb-logo-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#4B9EFF;margin-top:1px}
.sb-nav{padding:16px 0;flex:1}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:#9AA4B0;transition:color .15s,background .15s;border-left:2px solid transparent}
.sb-link:hover{color:#F2F5F7;background:rgba(255,255,255,.03)}
.sb-link.active{color:#4B9EFF;border-left-color:#4B9EFF;background:rgba(75,158,255,.06)}
.sb-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#5C6672;display:flex;align-items:center;justify-content:space-between}
.sb-user button{font-size:11px;color:#FF6B6B;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}

/* header */
.lead-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.lead-name{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px}
.lead-email{font-size:14px;color:#9AA4B0}
.lead-phone{font-size:14px;color:#9AA4B0;margin-top:2px}

/* stage select */
.stage-wrap{display:flex;align-items:center;gap:10px}
.stage-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5C6672}
select#stage-sel{background:#0D1117;border:1px solid rgba(255,255,255,.12);color:#F2F5F7;font-size:13px;padding:8px 12px;outline:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}
select#stage-sel:focus{border-color:#4B9EFF}
.stage-saved{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4BFF9E;display:none}

/* 2-col grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media(max-width:800px){.grid{grid-template-columns:1fr}}

/* cards */
.card{background:#0D1117;border:1px solid rgba(255,255,255,.07);padding:24px}
.card-title{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#4B9EFF;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}

/* attribute rows */
.attr-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.attr-key{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5C6672;min-width:130px;padding-top:2px;flex:none}
.attr-val{font-size:14px;color:#E0E6ED;line-height:1.5;word-break:break-word}
.attr-val.long{font-size:13px;color:#C8D0D8}

/* comms section */
.tab-row{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.07)}
.ctab{padding:9px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5C6672;border-bottom:2px solid transparent;transition:all .15s;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.ctab:hover{color:#F2F5F7}
.ctab.active{color:#4B9EFF;border-bottom-color:#4B9EFF}

.field{margin-bottom:14px}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5C6672;margin-bottom:7px}
input.finp, textarea.finp {width:100%;background:#06080B;border:1px solid rgba(255,255,255,.1);color:#F2F5F7;font-size:14px;padding:11px 14px;outline:none;resize:vertical;transition:border-color .2s}
input.finp:focus, textarea.finp:focus{border-color:#4B9EFF}
textarea.finp{min-height:120px;line-height:1.5}

.send-btn{padding:11px 24px;background:#4B9EFF;color:#030D1F;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.send-msg{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:10px;display:none}
.send-ok{color:#4BFF9E}
.send-err{color:#FF6B6B}

.back-link{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5C6672;margin-bottom:22px;transition:color .15s}
.back-link:hover{color:#F2F5F7}
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-logo">
      <svg width="28" height="28" viewBox="0 0 56 56" fill="none">
        <text x="28" y="31" text-anchor="middle" font-family="'Saira Condensed',sans-serif" font-weight="800" font-size="32" letter-spacing="-1.5"><tspan fill="#F2F5F7">J</tspan><tspan fill="#4B9EFF">B</tspan></text>
        <polyline points="11,45 21,41 29,44 45,32" fill="none" stroke="#4B9EFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="sb-logo-text">Jay Bonham</div>
        <div class="sb-logo-sub">Sales Portal</div>
      </div>
    </div>
    <nav class="sb-nav">
      <a href="/leads" class="sb-link active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Leads
      </a>
    </nav>
    <div class="sb-user">
      <span id="sb-username" style="font-family:'IBM Plex Mono',monospace;font-size:11px">—</span>
      <button onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <div style="color:#5C6672;font-size:14px;padding:60px 0;text-align:center">Loading…</div>
  </main>
</div>

<script>
var token = localStorage.getItem('jb_token');
var user  = localStorage.getItem('jb_user') || '';
if(!token) window.location.replace('/');
document.getElementById('sb-username').textContent = user;

var emailParam = decodeURIComponent(new URLSearchParams(window.location.search).get('email') || '');
if(!emailParam) window.location.replace('/leads');

var contact = null;

function logout() {
  localStorage.removeItem('jb_token');
  localStorage.removeItem('jb_user');
  window.location.replace('/');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

var STAGES = ['New Application','Call Booked','Call Completed','Proposal Sent','Joined','Lost'];

function stageBadgeColor(s) {
  var map = {'New Application':'#4B9EFF','Call Booked':'#4BFF9E','Call Completed':'#FFC84B','Proposal Sent':'#C84BFF','Joined':'#4BFFC8','Lost':'#FF6464'};
  return map[s] || '#9AA4B0';
}

function renderLead(c) {
  var a = c.attributes || {};
  var first = a.FIRSTNAME || '';
  var last  = a.LASTNAME  || '';
  var name  = (first + ' ' + last).trim() || c.email;
  var stage = (a.PIPELINE_STAGE || '').trim();
  if(!stage) stage = 'New Application';
  var phone = a.SMS || '';

  var stageOptions = STAGES.map(function(s) {
    return '<option value="' + esc(s) + '"' + (s===stage?' selected':'') + '>' + esc(s) + '</option>';
  }).join('');

  document.getElementById('main').innerHTML = `
    <a href="/leads" class="back-link">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Leads
    </a>

    <!-- Header -->
    <div class="lead-header">
      <div>
        <h1 class="lead-name">${esc(name)}</h1>
        <div class="lead-email">${esc(c.email)}</div>
        ${phone ? '<div class="lead-phone">' + esc(phone) + '</div>' : ''}
        <div style="margin-top:10px;font-size:13px;color:#5C6672;font-family:'IBM Plex Mono',monospace">Applied ${fmtDate(c.createdAt)}</div>
      </div>
      <div class="stage-wrap">
        <span class="stage-label">Stage</span>
        <select id="stage-sel" onchange="saveStage()">${stageOptions}</select>
        <span class="stage-saved" id="stage-saved">Saved ✓</span>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid">

      <!-- Application info -->
      <div>
        <div class="card" style="margin-bottom:20px">
          <div class="card-title">Application Details</div>
          ${row('Experience Level', a.EXPERIENCE_LEVEL)}
          ${row('Currently Trading', a.CURRENT_TRADING)}
          ${row('Trading Capital', a.TRADING_CAPITAL)}
          ${row('Capital (USD est.)', a.TRADING_CAPITAL_USD ? '$' + Number(a.TRADING_CAPITAL_USD).toLocaleString() : '')}
          ${row('Application Date', fmtDate(a.APPLICATION_DATE))}
        </div>
        <div class="card">
          <div class="card-title">Goals & Blockers</div>
          ${row('Biggest Blocker', a.BIGGEST_BLOCKER, true)}
          ${row('12-Month Goal', a.GOAL_12_MONTHS, true)}
        </div>
      </div>

      <!-- Comms -->
      <div class="card">
        <div class="card-title">Send Message</div>
        <div class="tab-row">
          <button class="ctab active" id="tab-email" onclick="switchTab('email')">Email</button>
          <button class="ctab" id="tab-sms" onclick="switchTab('sms')">SMS</button>
        </div>

        <!-- Email form -->
        <div id="form-email">
          <div class="field">
            <label>Subject</label>
            <input type="text" class="finp" id="email-subject" value="Following up on your application">
          </div>
          <div class="field">
            <label>Message</label>
            <textarea class="finp" id="email-body" placeholder="Hi ${esc(first) || 'there'},&#10;&#10;"></textarea>
          </div>
          <button class="send-btn" id="email-btn" onclick="sendMsg('email')">Send Email →</button>
          <div class="send-msg send-ok" id="email-ok">Email sent ✓</div>
          <div class="send-msg send-err" id="email-err"></div>
        </div>

        <!-- SMS form -->
        <div id="form-sms" style="display:none">
          <div class="field">
            <label>Phone</label>
            <input type="text" class="finp" id="sms-phone" value="${esc(phone)}" placeholder="+447…">
          </div>
          <div class="field">
            <label>Message <span style="color:#5C6672;font-size:10px">(160 chars)</span></label>
            <textarea class="finp" id="sms-body" maxlength="160" placeholder="Hi ${esc(first) || 'there'},"></textarea>
          </div>
          <button class="send-btn" id="sms-btn" onclick="sendMsg('sms')">Send SMS →</button>
          <div class="send-msg send-ok" id="sms-ok">SMS sent ✓</div>
          <div class="send-msg send-err" id="sms-err"></div>
        </div>
      </div>

    </div>
  `;
}

function row(label, val, long) {
  if(!val && val !== 0) return '';
  return '<div class="attr-row"><div class="attr-key">' + esc(label) + '</div>'
       + '<div class="attr-val' + (long?' long':'') + '">' + esc(String(val)) + '</div></div>';
}

function switchTab(tab) {
  document.getElementById('tab-email').classList.toggle('active', tab==='email');
  document.getElementById('tab-sms').classList.toggle('active', tab==='sms');
  document.getElementById('form-email').style.display = tab==='email' ? '' : 'none';
  document.getElementById('form-sms').style.display  = tab==='sms'   ? '' : 'none';
}

function saveStage() {
  var stage = document.getElementById('stage-sel').value;
  var saved = document.getElementById('stage-saved');
  saved.style.display = 'none';
  fetch('/api/admin-lead', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({email: emailParam, stage: stage})
  }).then(function(r){return r.json();}).then(function(d){
    if(d.ok){ saved.style.display='inline'; setTimeout(function(){ saved.style.display='none'; }, 2500); }
  });
}

function sendMsg(type) {
  var a = (contact && contact.attributes) || {};
  var first = a.FIRSTNAME || '';
  var last  = a.LASTNAME  || '';
  var name  = (first + ' ' + last).trim() || emailParam;

  var btn  = document.getElementById(type+'-btn');
  var okEl = document.getElementById(type+'-ok');
  var errEl= document.getElementById(type+'-err');
  okEl.style.display='none'; errEl.style.display='none';

  var body = {};
  if(type==='email'){
    var subject = (document.getElementById('email-subject').value||'').trim();
    var message = (document.getElementById('email-body').value||'').trim();
    if(!subject||!message){errEl.textContent='Subject and message required.';errEl.style.display='block';return;}
    body = {type:'email', to_email:emailParam, to_name:name, subject:subject, message:message};
  } else {
    var phone = (document.getElementById('sms-phone').value||'').trim();
    var message = (document.getElementById('sms-body').value||'').trim();
    if(!phone||!message){errEl.textContent='Phone and message required.';errEl.style.display='block';return;}
    body = {type:'sms', to_email:emailParam, to_name:name, to_phone:phone, message:message};
  }

  btn.disabled=true; btn.textContent='Sending…';
  fetch('/api/admin-send',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false;
    btn.textContent = type==='email' ? 'Send Email →' : 'Send SMS →';
    if(d.ok){
      okEl.style.display='block';
      if(type==='email') document.getElementById('email-body').value='';
      if(type==='sms')   document.getElementById('sms-body').value='';
    } else {
      errEl.textContent = d.error || 'Failed to send.';
      errEl.style.display='block';
    }
  }).catch(function(){
    btn.disabled=false;
    btn.textContent = type==='email' ? 'Send Email →' : 'Send SMS →';
    errEl.textContent='Network error.'; errEl.style.display='block';
  });
}

// Load contact
fetch('/api/admin-lead?email=' + encodeURIComponent(emailParam), {
  headers: {'Authorization': 'Bearer ' + token}
})
.then(function(r){
  if(r.status===401){logout();return null;}
  return r.json();
})
.then(function(data){
  if(!data||!data.ok){
    document.getElementById('main').innerHTML='<div style="padding:60px;color:#FF6B6B;font-size:14px">Contact not found.</div>';
    return;
  }
  contact = data.contact;
  renderLead(contact);
})
.catch(function(){
  document.getElementById('main').innerHTML='<div style="padding:60px;color:#FF6B6B;font-size:14px">Failed to load contact.</div>';
});
</script>
</body>
</html>
